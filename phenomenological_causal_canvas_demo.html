<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elysia Phenomenological Causal Canvas 3D</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #e0e6ed;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }

        #overlay-ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            background: rgba(10, 15, 25, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(0, 255, 200, 0.3);
            border-radius: 12px;
            padding: 20px;
            width: 340px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 1.1rem;
            margin-top: 0;
            color: #00ffcc;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .metric-group {
            margin-bottom: 15px;
        }

        label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: #a0aec0;
        }

        input[type=range] {
            width: 100%;
            accent-color: #00ffcc;
        }

        .metric-val {
            color: #00ffcc;
            font-weight: bold;
        }

        button {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #00c6ff, #0072ff);
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(0, 198, 255, 0.4);
        }

        #status-panel {
            position: absolute;
            bottom: 20px;
            right: 20px;
            z-index: 10;
            background: rgba(10, 15, 25, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 200, 0, 0.3);
            border-radius: 12px;
            padding: 15px 20px;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>

    <div id="overlay-ui">
        <h1>Elysia Causal Field 3D</h1>

        <div class="metric-group">
            <label>Total Consistency (C_total): <span id="val-c-total" class="metric-val">0.14</span></label>
            <input type="range" id="slider-c-total" min="0" max="1" step="0.01" value="0.14">
            <small style="color: #718096; font-size: 0.75rem;">Controls SDF surface noise distortion</small>
        </div>

        <div class="metric-group">
            <label>Cross Friction (F_cross): <span id="val-f-cross" class="metric-val">1.33</span></label>
            <input type="range" id="slider-f-cross" min="0" max="2" step="0.01" value="1.33">
            <small style="color: #718096; font-size: 0.75rem;">Controls volume turbulence & chromatic aberration</small>
        </div>

        <div class="metric-group">
            <label>Order Parameter (η): <span id="val-eta" class="metric-val">0.10</span></label>
            <input type="range" id="slider-eta" min="0" max="1" step="0.01" value="0.10">
            <small style="color: #718096; font-size: 0.75rem;">Controls phase transition manifold shape</small>
        </div>

        <button id="btn-trigger-p3">Trigger P3 Resolution Loop</button>
        <button id="btn-trigger-shock" style="margin-top: 8px; background: linear-gradient(135deg, #ff416c, #ff4b2b);">Inject External Perturbation Shock</button>
    </div>

    <div id="status-panel">
        <div><strong>Phase State:</strong> <span id="text-phase-state" style="color: #ffaa00;">Pre-Resolution Friction</span></div>
        <div><strong>Resolution:</strong> <span id="text-resolution">P3 Loop Ready</span></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const vertexShader = `
            varying vec2 vUv;
            void main() {
                vUv = uv;
                gl_Position = vec4(position, 1.0);
            }
        `;

        const fragmentShader = `
            uniform vec2 u_resolution;
            uniform float u_time;
            uniform float u_c_total;
            uniform float u_f_cross;
            uniform float u_eta;

            varying vec2 vUv;

            #define MAX_STEPS 64
            #define SURF_DIST 0.01
            #define MAX_DIST 20.0

            // Simple 3D noise for surface distortion
            float hash(vec3 p) {
                p = fract(p * 0.3183099 + .1);
                p *= 17.0;
                return fract(p.x * p.y * p.z * (p.x + p.y + p.z));
            }

            float noise3D(vec3 x) {
                vec3 i = floor(x);
                vec3 f = fract(x);
                f = f * f * (3.0 - 2.0 * f);
                return mix(mix(mix(hash(i + vec3(0,0,0)), hash(i + vec3(1,0,0)), f.x),
                               mix(hash(i + vec3(0,1,0)), hash(i + vec3(1,1,0)), f.x), f.y),
                           mix(mix(hash(i + vec3(0,0,1)), hash(i + vec3(1,0,1)), f.x),
                               mix(hash(i + vec3(0,1,1)), hash(i + vec3(1,1,1)), f.x), f.y), f.z);
            }

            // Signed Distance Function (SDF) of Causal Manifold
            float getDist(vec3 p) {
                vec3 pRot = p;
                float angle = u_time * 0.3;
                pRot.xz = mat2(cos(angle), -sin(angle), sin(angle), cos(angle)) * pRot.xz;

                float sphereDist = length(pRot) - (1.2 + 0.4 * u_eta);

                // Noise distortion proportional to (1.0 - C_total)
                float noiseVal = noise3D(pRot * 3.0 + u_time) * (1.0 - u_c_total) * 0.6;

                // Turbulence ripple from F_cross
                float ripple = sin(pRot.x * 5.0 + u_time * 3.0) * cos(pRot.y * 5.0) * u_f_cross * 0.15;

                return sphereDist + noiseVal + ripple;
            }

            vec3 getNormal(vec3 p) {
                float d = getDist(p);
                vec2 e = vec2(0.01, 0);
                vec3 n = d - vec3(
                    getDist(p - e.xyy),
                    getDist(p - e.yxy),
                    getDist(p - e.yyx)
                );
                return normalize(n);
            }

            void main() {
                vec2 uv = (gl_FragCoord.xy - 0.5 * u_resolution.xy) / u_resolution.y;

                vec3 ro = vec3(0, 0, -3.5); // Camera position
                vec3 rd = normalize(vec3(uv, 1.0));

                float dO = 0.0;
                vec3 col = vec3(0.02, 0.03, 0.05); // Background

                for(int i = 0; i < MAX_STEPS; i++) {
                    vec3 p = ro + rd * dO;
                    float dS = getDist(p);
                    dO += dS;
                    if(dO > MAX_DIST || dS < SURF_DIST) break;
                }

                if(dO < MAX_DIST) {
                    vec3 p = ro + rd * dO;
                    vec3 n = getNormal(p);
                    vec3 lightDir = normalize(vec3(1, 2, -3));

                    float diff = max(0.0, dot(n, lightDir));
                    float fresnel = pow(1.0 - max(0.0, dot(-rd, n)), 3.0);

                    // Color based on Order Parameter η and F_cross friction
                    vec3 baseColor = mix(vec3(0.9, 0.2, 0.2), vec3(0.0, 0.9, 0.7), u_c_total);
                    vec3 frictionGlow = vec3(1.0, 0.4, 0.0) * u_f_cross * 0.5;

                    col = baseColor * diff + fresnel * vec3(0.8, 0.9, 1.0) + frictionGlow;
                }

                // Chromatic aberration glow when F_cross is high
                col.r += u_f_cross * 0.08 * sin(uv.x * 20.0 + u_time);
                col.g += u_c_total * 0.05;

                gl_FragColor = vec4(col, 1.0);
            }
        `;

        let scene, camera, renderer, material;
        let cTotal = 0.14, fCross = 1.33, eta = 0.10;

        function init() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            container.appendChild(renderer.domElement);

            material = new THREE.ShaderMaterial({
                vertexShader: vertexShader,
                fragmentShader: fragmentShader,
                uniforms: {
                    u_resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
                    u_time: { value: 0 },
                    u_c_total: { value: cTotal },
                    u_f_cross: { value: fCross },
                    u_eta: { value: eta }
                }
            });

            const plane = new THREE.PlaneGeometry(2, 2);
            const mesh = new THREE.Mesh(plane, material);
            scene.add(mesh);

            window.addEventListener('resize', onWindowResize);
            setupUI();
            animate(0);
        }

        function setupUI() {
            const sliderCTotal = document.getElementById('slider-c-total');
            const sliderFCross = document.getElementById('slider-f-cross');
            const sliderEta = document.getElementById('slider-eta');

            sliderCTotal.addEventListener('input', (e) => {
                cTotal = parseFloat(e.target.value);
                document.getElementById('val-c-total').innerText = cTotal.toFixed(2);
            });

            sliderFCross.addEventListener('input', (e) => {
                fCross = parseFloat(e.target.value);
                document.getElementById('val-f-cross').innerText = fCross.toFixed(2);
            });

            sliderEta.addEventListener('input', (e) => {
                eta = parseFloat(e.target.value);
                document.getElementById('val-eta').innerText = eta.toFixed(2);
            });

            document.getElementById('btn-trigger-p3').addEventListener('click', () => {
                animateP3Resolution();
            });

            document.getElementById('btn-trigger-shock').addEventListener('click', () => {
                animateShockTransition();
            });
        }

        function animateP3Resolution() {
            let step = 0;
            const interval = setInterval(() => {
                cTotal = Math.min(1.0, cTotal + 0.1);
                fCross = Math.max(0.0, fCross - 0.15);

                document.getElementById('slider-c-total').value = cTotal;
                document.getElementById('slider-f-cross').value = fCross;
                document.getElementById('val-c-total').innerText = cTotal.toFixed(2);
                document.getElementById('val-f-cross').innerText = fCross.toFixed(2);

                step++;
                if (step >= 10) {
                    clearInterval(interval);
                    document.getElementById('text-phase-state').innerText = "P3 Resolved Equilibrium";
                    document.getElementById('text-phase-state').style.color = "#00ffcc";
                }
            }, 100);
        }

        function animateShockTransition() {
            let step = 0;
            const interval = setInterval(() => {
                eta = Math.min(1.0, eta + 0.1);
                cTotal = 0.95;
                fCross = 0.1;

                document.getElementById('slider-eta').value = eta;
                document.getElementById('val-eta').innerText = eta.toFixed(2);

                step++;
                if (step >= 10) {
                    clearInterval(interval);
                    document.getElementById('text-phase-state').innerText = "Phase Transition Complete (η ≈ 1.0)";
                    document.getElementById('text-phase-state').style.color = "#ff0077";
                }
            }, 100);
        }

        function onWindowResize() {
            renderer.setSize(window.innerWidth, window.innerHeight);
            material.uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
        }

        function animate(time) {
            requestAnimationFrame(animate);
            material.uniforms.u_time.value = time * 0.001;
            material.uniforms.u_c_total.value = cTotal;
            material.uniforms.u_f_cross.value = fCross;
            material.uniforms.u_eta.value = eta;
            renderer.render(scene, camera);
        }

        window.onload = init;
    </script>
</body>
</html>
